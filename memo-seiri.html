<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ整理帳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kurenaido&display=swap');

  :root{
    --washi:#f3ede0;
    --washi-dark:#e8dfc9;
    --ink:#1f2b3d;
    --ink-light:#3a4a63;
    --hanko:#a3352b;
    --line:#c9bfa3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    font-family:'Zen Kurenaido', sans-serif;
    color:var(--ink);
    padding:24px 16px 60px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:1.6rem;
    text-align:center;
    letter-spacing:.15em;
    margin:8px 0 4px;
    color:var(--ink);
  }
  .sub{
    text-align:center;
    font-size:.8rem;
    color:var(--ink-light);
    margin-bottom:24px;
    letter-spacing:.05em;
  }
  .card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
    max-width:640px;
    margin:0 auto 20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  label{
    display:block;
    font-size:.85rem;
    color:var(--ink-light);
    margin-bottom:6px;
    font-family:'Shippori Mincho', serif;
  }
  textarea, input[type=text], input[type=password]{
    width:100%;
    font-family:'Zen Kurenaido', sans-serif;
    font-size:.95rem;
    padding:10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fffefb;
    color:var(--ink);
    resize:vertical;
  }
  textarea{min-height:180px; line-height:1.6;}
  .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  button{
    font-family:'Shippori Mincho', serif;
    font-size:.9rem;
    letter-spacing:.1em;
    padding:10px 20px;
    border-radius:3px;
    border:1px solid var(--hanko);
    background:var(--hanko);
    color:#fdf6ec;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.secondary{
    background:transparent;
    color:var(--hanko);
  }
  button:disabled{opacity:.5; cursor:default;}
  button:hover:not(:disabled){opacity:.85;}
  .settings-toggle{
    text-align:center;
    font-size:.78rem;
    color:var(--ink-light);
    cursor:pointer;
    text-decoration:underline;
    margin-bottom:16px;
  }
  #settingsBox{display:none; max-width:640px; margin:0 auto 20px;}
  .result-group{
    max-width:640px;
    margin:0 auto 16px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-left:4px solid var(--hanko);
    border-radius:2px;
    padding:14px 16px;
  }
  .result-group h2{
    font-family:'Shippori Mincho', serif;
    font-size:1.05rem;
    margin:0 0 8px;
    color:var(--ink);
  }
  .result-group ul{margin:0; padding-left:1.2em;}
  .result-group li{margin-bottom:6px; line-height:1.5;}
  .tag{
    display:inline-block;
    font-size:.7rem;
    background:var(--washi-dark);
    color:var(--ink-light);
    padding:1px 6px;
    border-radius:10px;
    margin-left:6px;
  }
  .status{
    text-align:center;
    font-size:.85rem;
    color:var(--ink-light);
    margin:12px 0;
    min-height:1.2em;
  }
  .copyall{
    display:block;
    max-width:640px;
    margin:0 auto 10px;
    text-align:right;
  }
</style>
</head>
<body>

<h1>メモ整理帳</h1>
<div class="sub">散らばったメモを、AIがすっと整える</div>

<div class="card">
  <label>整理したいメモを貼り付けてください（複数のメモは空行で区切るときれいに分かれます）</label>
  <textarea id="input" placeholder="例）&#10;明日の職員会議 13時から&#10;&#10;牛乳、卵、味噌を買う&#10;&#10;3年2組 漢字テストの採点まだ"></textarea>
  <div class="row">
    <button id="organizeBtn">AI で整理する</button>
    <button class="secondary" id="clearBtn">クリア</button>
  </div>
</div>

<div class="settings-toggle" id="settingsToggle">Gemini APIキーの設定 ▾</div>
<div id="settingsBox" class="card">
  <label>Gemini API キー（お使いのブラウザにのみ保存されます）</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <div class="row">
    <button id="saveKeyBtn">保存</button>
  </div>
</div>

<div class="status" id="status"></div>
<div class="copyall" id="copyAllWrap" style="display:none;">
  <button class="secondary" id="copyAllBtn">整理結果を全てコピー</button>
</div>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);
const KEY_STORAGE = 'memo_seiri_gemini_key';

// --- settings ---
$('settingsToggle').onclick = () => {
  const box = $('settingsBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};
$('apiKey').value = localStorage.getItem(KEY_STORAGE) || '';
$('saveKeyBtn').onclick = () => {
  localStorage.setItem(KEY_STORAGE, $('apiKey').value.trim());
  $('status').textContent = 'APIキーを保存しました。';
  setTimeout(()=> $('status').textContent = '', 2000);
};

$('clearBtn').onclick = () => {
  $('input').value = '';
  $('results').innerHTML = '';
  $('copyAllWrap').style.display = 'none';
};

let lastOrganized = null;

$('organizeBtn').onclick = async () => {
  const text = $('input').value.trim();
  if (!text) {
    $('status').textContent = '整理するメモを入力してください。';
    return;
  }
  const apiKey = localStorage.getItem(KEY_STORAGE);
  if (!apiKey) {
    $('status').textContent = '先に「Gemini APIキーの設定」からキーを保存してください。';
    $('settingsBox').style.display = 'block';
    return;
  }

  $('organizeBtn').disabled = true;
  $('status').textContent = 'AIが整理しています…';
  $('results').innerHTML = '';
  $('copyAllWrap').style.display = 'none';

  const prompt = `以下は雑多に書かれたメモの集まりです。内容を読み取り、次のルールで整理してください。

【ルール】
- 内容ごとに適切なカテゴリに分類する（例: 仕事・授業/校務、買い物・日用品、予定・締切、アイデア・メモ、個人的な用事、その他 など。メモの内容に合わせて自然なカテゴリ名を作ってよい）
- 明らかに重複・類似する内容はまとめる
- 各メモは簡潔な一文に整える（意味は変えない）
- 期限や日時の情報があれば残す
- 出力は必ず以下のJSON形式のみ。前置きや説明、Markdownのコードブロック記号は一切つけない。

{
  "groups": [
    {
      "category": "カテゴリ名",
      "items": [
        {"text": "整理された一文", "tag": "任意の短いタグ（期限や重要度など、なければ空文字）"}
      ]
    }
  ]
}

【メモ】
${text}`;

  try {
    const response = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey),
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      }
    );

    if (!response.ok) {
      const errText = await response.text();
      throw new Error('APIエラー: ' + response.status + ' ' + errText.slice(0,200));
    }

    const data = await response.json();
    let raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    raw = raw.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();

    const parsed = JSON.parse(raw);
    lastOrganized = parsed;
    renderResults(parsed);
    $('status').textContent = '整理が完了しました。';
  } catch (err) {
    console.error(err);
    $('status').textContent = 'エラーが発生しました: ' + err.message;
  } finally {
    $('organizeBtn').disabled = false;
  }
};

function renderResults(parsed) {
  const container = $('results');
  container.innerHTML = '';
  if (!parsed.groups || !parsed.groups.length) {
    container.innerHTML = '<div class="status">分類結果がありませんでした。</div>';
    return;
  }
  parsed.groups.forEach(group => {
    const div = document.createElement('div');
    div.className = 'result-group';
    const h2 = document.createElement('h2');
    h2.textContent = group.category;
    div.appendChild(h2);
    const ul = document.createElement('ul');
    (group.items || []).forEach(item => {
      const li = document.createElement('li');
      li.textContent = item.text;
      if (item.tag) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = item.tag;
        li.appendChild(tag);
      }
      ul.appendChild(li);
    });
    div.appendChild(ul);
    container.appendChild(div);
  });
  $('copyAllWrap').style.display = 'block';
}

$('copyAllBtn').onclick = () => {
  if (!lastOrganized) return;
  let out = '';
  lastOrganized.groups.forEach(g => {
    out += `【${g.category}】\n`;
    (g.items || []).forEach(item => {
      out += `・${item.text}${item.tag ? '（' + item.tag + '）' : ''}\n`;
    });
    out += '\n';
  });
  navigator.clipboard.writeText(out.trim()).then(() => {
    $('status').textContent = 'コピーしました。メモアプリに貼り付けてください。';
    setTimeout(()=> $('status').textContent = '', 2500);
  });
};
</script>

</body>
</html>
