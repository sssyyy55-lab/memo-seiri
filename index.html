<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ整理帳</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="メモ整理帳">
<meta name="theme-color" content="#f3ede0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kurenaido&display=swap');

  :root{
    --washi:#f3ede0;
    --washi-dark:#e8dfc9;
    --ink:#1f2b3d;
    --ink-light:#3a4a63;
    --hanko:#a3352b;
    --line:#c9bfa3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    font-family:'Zen Kurenaido', sans-serif;
    color:var(--ink);
    padding:24px 16px 60px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:1.6rem;
    text-align:center;
    letter-spacing:.15em;
    margin:8px 0 4px;
    color:var(--ink);
  }
  .sub{
    text-align:center;
    font-size:.8rem;
    color:var(--ink-light);
    margin-bottom:24px;
    letter-spacing:.05em;
  }
  .card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
    max-width:640px;
    margin:0 auto 20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  label{
    display:block;
    font-size:.85rem;
    color:var(--ink-light);
    margin-bottom:6px;
    font-family:'Shippori Mincho', serif;
  }
  textarea, input[type=text], input[type=password]{
    width:100%;
    font-family:'Zen Kurenaido', sans-serif;
    font-size:.95rem;
    padding:10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fffefb;
    color:var(--ink);
    resize:vertical;
  }
  textarea{min-height:180px; line-height:1.6;}
  .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  button{
    font-family:'Shippori Mincho', serif;
    font-size:.9rem;
    letter-spacing:.1em;
    padding:10px 20px;
    border-radius:3px;
    border:1px solid var(--hanko);
    background:var(--hanko);
    color:#fdf6ec;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.secondary{
    background:transparent;
    color:var(--hanko);
  }
  button:disabled{opacity:.5; cursor:default;}
  button.listening{
    background:var(--hanko);
    color:#fdf6ec;
    animation:pulse 1.3s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(163,53,43,.45);}
    50%{box-shadow:0 0 0 9px rgba(163,53,43,0);}
  }
  .hint{font-size:.78rem; color:var(--ink-light); margin-top:10px; line-height:1.6;}
  button:hover:not(:disabled){opacity:.85;}
  .settings-toggle{
    text-align:center;
    font-size:.78rem;
    color:var(--ink-light);
    cursor:pointer;
    text-decoration:underline;
    margin-bottom:16px;
  }
  #settingsBox{display:none; max-width:640px; margin:0 auto 20px;}
  .result-group{
    max-width:640px;
    margin:0 auto 16px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-left:4px solid var(--hanko);
    border-radius:2px;
    padding:14px 16px;
  }
  .result-group h2{
    font-family:'Shippori Mincho', serif;
    font-size:1.05rem;
    margin:0 0 8px;
    color:var(--ink);
  }
  .result-group ul{margin:0; padding-left:1.2em;}
  .result-group li{margin-bottom:6px; line-height:1.5;}
  .tag{
    display:inline-block;
    font-size:.7rem;
    background:var(--washi-dark);
    color:var(--ink-light);
    padding:1px 6px;
    border-radius:10px;
    margin-left:6px;
  }
  .status{
    text-align:center;
    font-size:.85rem;
    color:var(--ink-light);
    margin:12px 0;
    min-height:1.2em;
  }
  .copyall{
    display:block;
    max-width:640px;
    margin:0 auto 10px;
    text-align:right;
  }
</style>
</head>
<body>

<h1>メモ整理帳</h1>
<div class="sub">散らばったメモを、AIがすっと整える</div>

<div class="card">
  <label>整理したいメモを貼り付けてください（複数のメモは空行で区切るときれいに分かれます）</label>
  <textarea id="input" placeholder="例）&#10;明日の職員会議 13時から&#10;&#10;牛乳、卵、味噌を買う&#10;&#10;3年2組 漢字テストの採点まだ"></textarea>
  <div class="row">
    <button id="organizeBtn">AI で整理する</button>
    <button class="secondary" id="clearBtn">クリア</button>
    <button class="secondary" id="micBtn" type="button">🎤 音声入力</button>
    <button class="secondary" id="breakBtn" type="button">↵ 区切り</button>
  </div>
  <div class="hint" id="micHint">🎤 で話した内容が、そのまま入力欄に入ります。メモを分けたいときは「↵ 区切り」を押してください。ボタンが動かないときは、キーボードのマイクキーでも話せます。</div>
</div>

<div class="settings-toggle" id="settingsToggle">Gemini APIキーの設定 ▾</div>
<div id="settingsBox" class="card">
  <label>Gemini API キー（お使いのブラウザにのみ保存されます）</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <div class="row">
    <button id="saveKeyBtn">保存</button>
  </div>
</div>

<div class="status" id="status"></div>
<div class="copyall" id="copyAllWrap" style="display:none;">
  <button class="secondary" id="copyAllBtn">整理結果を全てコピー</button>
</div>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);
const KEY_STORAGE = 'memo_seiri_gemini_key';

// --- settings ---
$('settingsToggle').onclick = () => {
  const box = $('settingsBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};
$('apiKey').value = localStorage.getItem(KEY_STORAGE) || '';
$('saveKeyBtn').onclick = () => {
  localStorage.setItem(KEY_STORAGE, $('apiKey').value.trim());
  $('status').textContent = 'APIキーを保存しました。';
  setTimeout(()=> $('status').textContent = '', 2000);
};

$('clearBtn').onclick = () => {
  if (typeof listening !== 'undefined' && listening) stopMic();
  $('input').value = '';
  $('results').innerHTML = '';
  $('copyAllWrap').style.display = 'none';
};

let lastOrganized = null;

// --- 音声入力（ブラウザの音声認識）---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let rec = null, listening = false, baseText = '', finalText = '', idleCount = 0, fatalStop = false;

function setMic(on) {
  listening = on;
  $('micBtn').classList.toggle('listening', on);
  $('micBtn').textContent = on ? '⏹ 止める' : '🎤 音声入力';
}
function renderVoice(interim) {
  const box = $('input');
  box.value = baseText + finalText + (interim || '');
  box.scrollTop = box.scrollHeight;
}
function setupRec() {
  rec = new SR();
  rec.lang = 'ja-JP';
  rec.interimResults = true;
  rec.continuous = !isIOS;   // iPhoneは「短く区切って自動で再開」のほうが安定する
  rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    idleCount = 0;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    renderVoice(interim);
  };
  rec.onerror = (e) => {
    const msg = {
      'not-allowed': 'マイクの使用が許可されていません。Safari／ブラウザの設定で、このページのマイクを許可してください。',
      'service-not-allowed': '音声認識が許可されていません。端末の設定で、音声入力（Siriと音声入力）がオンか確認してください。',
      'audio-capture': 'マイクが見つかりません。',
      'network': '音声認識のサーバーに通信できませんでした。'
    }[e.error];
    if (msg) { fatalStop = true; $('status').textContent = msg; }
    else if (e.error === 'no-speech') { idleCount++; }
  };
  rec.onend = () => {
    if (listening && !fatalStop) {
      if (idleCount >= 3) {
        stopMic();
        $('status').textContent = '声が聞こえないので、音声入力を止めました。';
        return;
      }
      // 聞き取りの切れ目: 途中の文字は確定分だけ残して、すぐ再開する
      const said = finalText.length > 0;
      renderVoice('');
      baseText = $('input').value; finalText = '';
      if (said && !/\n$/.test(baseText)) { baseText += '\n'; $('input').value = baseText; }  // ひと息ごとに改行
      setTimeout(() => { if (listening) { try { rec.start(); } catch (_) {} } }, 250);
    } else {
      setMic(false);
    }
  };
}
function startMic() {
  if (!rec) setupRec();
  baseText = $('input').value;
  if (baseText && !/\n$/.test(baseText)) baseText += '\n';
  finalText = ''; idleCount = 0; fatalStop = false;
  setMic(true);
  $('status').textContent = '聞いています。話しかけてください。';
  try { rec.start(); }
  catch (e) { setMic(false); $('status').textContent = '音声入力を始められませんでした: ' + e.message; }
}
function stopMic() {
  listening = false;
  try { rec && rec.stop(); } catch (_) {}
  setMic(false);
  if ($('status').textContent.startsWith('聞いています')) $('status').textContent = '';
}
if (!SR) {
  $('micBtn').style.display = 'none';
  $('breakBtn').style.display = 'none';
  $('micHint').textContent = 'この画面では音声入力ボタンが使えません。キーボードのマイクキーで話すと、入力欄に文字が入ります。';
} else {
  $('micBtn').onclick = () => (listening ? stopMic() : startMic());
  $('breakBtn').onclick = () => {
    const t = $('input').value.replace(/\s+$/, '');
    if (!t) return;
    $('input').value = t + '\n\n';
    if (listening) { baseText = $('input').value; finalText = ''; }
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && listening) stopMic(); });
}

// --- モデルは固定しない: 使えるモデルを一覧から探し、ダメなら次へ ---
const API = 'https://generativelanguage.googleapis.com/v1beta/';
const MODEL_STORAGE = 'memo_seiri_gemini_model';

async function listModels(apiKey) {
  const res = await fetch(API + 'models?pageSize=200&key=' + encodeURIComponent(apiKey));
  if (!res.ok) throw new Error('モデル一覧の取得に失敗: ' + res.status);
  const data = await res.json();
  const skip = /(lite|image|tts|audio|live|embed|robotics|computer|exp|learnlm|gemma|aqa|imagen|veo)/i;
  const list = (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-\d/.test(n) && /flash/.test(n) && !skip.test(n))
    .map(n => ({ name: n, ver: parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)/) || [0, 0])[1]), pre: /preview/.test(n) }));
  // 正式版を優先し、その中でバージョンが新しいものから
  list.sort((a, b) => (a.pre - b.pre) || (b.ver - a.ver) || (a.name.length - b.name.length));
  return list.map(x => x.name);
}

async function callGemini(apiKey, model, prompt) {
  let res;
  try {
    res = await fetch(API + 'models/' + model + ':generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });
  } catch (netErr) {
    // 応答そのものが返らない＝モデルの問題ではなく、通信が遮られている
    const e = new Error('Geminiに通信できませんでした。ネットワーク、広告ブロック、VPN、または今開いている画面の制限が考えられます。公開したページのURLをブラウザの新しいタブで開いて試してください。（' + netErr.message + '）');
    e.network = true;
    throw e;
  }
  if (!res.ok) {
    const t = await res.text();
    const e = new Error('APIエラー: ' + res.status + ' ' + t.slice(0, 200));
    e.status = res.status;
    e.body = t;
    throw e;
  }
  const data = await res.json();
  const raw = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!raw) throw new Error('AIから空の応答が返りました');
  return raw;
}

async function generateWithFallback(apiKey, prompt) {
  const candidates = [];
  const saved = localStorage.getItem(MODEL_STORAGE);
  if (saved) candidates.push(saved);
  try {
    for (const n of await listModels(apiKey)) if (!candidates.includes(n)) candidates.push(n);
  } catch (e) { console.warn(e); }
  if (!candidates.length) candidates.push('gemini-2.5-flash', 'gemini-3.5-flash');
  let lastErr;
  for (const model of candidates.slice(0, 5)) {
    try {
      $('status').textContent = 'AIが整理しています…（' + model + '）';
      const raw = await callGemini(apiKey, model, prompt);
      localStorage.setItem(MODEL_STORAGE, model);
      return raw;
    } catch (e) {
      lastErr = e;
      console.warn(model, e);
      // キーそのものが無効なら、他のモデルを試しても無駄
      if (e.network || e.status === 401 || e.status === 403 || (e.status === 400 && /API key/i.test(e.body || ''))) break;
    }
  }
  if (!(lastErr && lastErr.network)) localStorage.removeItem(MODEL_STORAGE);
  throw lastErr || new Error('使えるモデルが見つかりませんでした');
}

$('organizeBtn').onclick = async () => {
  if (listening) stopMic();
  const text = $('input').value.trim();
  if (!text) {
    $('status').textContent = '整理するメモを入力してください。';
    return;
  }
  const apiKey = localStorage.getItem(KEY_STORAGE);
  if (!apiKey) {
    $('status').textContent = '先に「Gemini APIキーの設定」からキーを保存してください。';
    $('settingsBox').style.display = 'block';
    return;
  }

  $('organizeBtn').disabled = true;
  $('status').textContent = 'AIが整理しています…';
  $('results').innerHTML = '';
  $('copyAllWrap').style.display = 'none';

  const prompt = `以下は雑多に書かれたメモの集まりです。内容を読み取り、次のルールで整理してください。

【ルール】
- 内容ごとに適切なカテゴリに分類する（例: 仕事・授業/校務、買い物・日用品、予定・締切、アイデア・メモ、個人的な用事、その他 など。メモの内容に合わせて自然なカテゴリ名を作ってよい）
- 明らかに重複・類似する内容はまとめる
- 各メモは簡潔な一文に整える（意味は変えない）
- 期限や日時の情報があれば残す
- 出力は必ず以下のJSON形式のみ。前置きや説明、Markdownのコードブロック記号は一切つけない。

{
  "groups": [
    {
      "category": "カテゴリ名",
      "items": [
        {"text": "整理された一文", "tag": "任意の短いタグ（期限や重要度など、なければ空文字）"}
      ]
    }
  ]
}

【メモ】
${text}`;

  try {
    let raw = await generateWithFallback(apiKey, prompt);
    raw = raw.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();

    const parsed = JSON.parse(raw);
    lastOrganized = parsed;
    renderResults(parsed);
    $('status').textContent = '整理が完了しました。';
  } catch (err) {
    console.error(err);
    $('status').textContent = 'エラーが発生しました: ' + err.message;
  } finally {
    $('organizeBtn').disabled = false;
  }
};

function renderResults(parsed) {
  const container = $('results');
  container.innerHTML = '';
  if (!parsed.groups || !parsed.groups.length) {
    container.innerHTML = '<div class="status">分類結果がありませんでした。</div>';
    return;
  }
  parsed.groups.forEach(group => {
    const div = document.createElement('div');
    div.className = 'result-group';
    const h2 = document.createElement('h2');
    h2.textContent = group.category;
    div.appendChild(h2);
    const ul = document.createElement('ul');
    (group.items || []).forEach(item => {
      const li = document.createElement('li');
      li.textContent = item.text;
      if (item.tag) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = item.tag;
        li.appendChild(tag);
      }
      ul.appendChild(li);
    });
    div.appendChild(ul);
    container.appendChild(div);
  });
  $('copyAllWrap').style.display = 'block';
}

$('copyAllBtn').onclick = () => {
  if (!lastOrganized) return;
  let out = '';
  lastOrganized.groups.forEach(g => {
    out += `【${g.category}】\n`;
    (g.items || []).forEach(item => {
      out += `・${item.text}${item.tag ? '（' + item.tag + '）' : ''}\n`;
    });
    out += '\n';
  });
  navigator.clipboard.writeText(out.trim()).then(() => {
    $('status').textContent = 'コピーしました。メモアプリに貼り付けてください。';
    setTimeout(()=> $('status').textContent = '', 2500);
  });
};
</script>

</body>
</html>
